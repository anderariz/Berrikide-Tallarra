<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__</script>
<script>(() => {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia("(prefers-color-scheme: dark)");
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    "codex-visualization-widget-state",
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? "{}");
  initialStateElement?.remove();
  /** @type {Record<string, unknown> | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? "none";
  let nextStateRequestId = 0;
  /** @type {Map<number, { resolve: () => void; reject: (error: Error) => void; timeout: ReturnType<typeof globalThis.setTimeout>; serializedState: string }>} */
  const pendingStateWrites = new Map();
  const persistenceError = () =>
    Object.assign(
      new Error("The host could not persist the widget state update"),
      {
        code: -32000,
        data: { code: "widget_state_persistence_failed", retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) => {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, "data");
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, "ports");
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, "source");
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) => {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record<string, unknown> | ((previous: Record<string, unknown> | null) => Record<string, unknown>)} next
   * @returns {Promise<void>}
   */
  const setWidgetState = async (next) => {
    const nextState = typeof next === "function" ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) => {
        if (
          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||
          (typeof value === "number" && !Number.isFinite(value))
        ) {
          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    if (
      hasOwn(storedState, "imageIds") &&
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) => typeof id !== "string",
        ))
    ) {
      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length > 0) {
      throw Object.assign(
        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === "none") {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) => {
      const timeout = globalThis.setTimeout(() => {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost("widget-state-write", { id, state: serializedState });
    });
  };
  const syncTheme = () => {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () => {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) => {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) => {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" && data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &&
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) => {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

</script>

#bkd-taller{font:16px/1.45 system-ui,sans-serif;color:light-dark(#17232f,#edf3f8);background:light-dark(#eef2f5,#151e26);border-radius:16px;overflow:hidden;color-scheme:light dark}#bkd-taller *{box-sizing:border-box}#bkd-taller header{background:light-dark(#fff,#202c36);padding:20px 110px 20px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid light-dark(#d9e1e7,#3b4852)}#bkd-taller .brand{font-weight:750;letter-spacing:-1px;font-size:24px}#bkd-taller .brand span{color:light-dark(#007cad,#55cbff)}#bkd-taller small{font-size:13px;color:light-dark(#546574,#b4c2cd)}#bkd-taller .layout{display:grid;grid-template-columns:280px 1fr;min-height:550px}#bkd-taller aside{padding:22px 16px;border-right:1px solid light-dark(#d9e1e7,#3b4852)}#bkd-taller button{font:inherit;cursor:pointer;min-height:48px;border:1px solid light-dark(#cbd6df,#53626e);border-radius:10px;background:light-dark(#fff,#263540);color:inherit;padding:12px 16px}#bkd-taller .machine{display:block;text-align:left;width:100%;margin:12px 0;padding:18px}#bkd-taller .machine[aria-pressed=true]{border:2px solid #00a8f3;background:light-dark(#e5f6ff,#123b50)}#bkd-taller .machine strong,#bkd-taller .machine small{display:block}#bkd-taller .status{display:inline-block;margin-top:10px;font-size:14px}#bkd-taller main{padding:28px;min-width:0}#bkd-taller h2{font-size:28px;line-height:1.2;margin:12px 0 18px}#bkd-taller h3{margin:0 0 12px;font-size:17px}#bkd-taller .step{background:light-dark(#fff,#202c36);padding:26px;border-radius:14px;margin:18px 0}#bkd-taller .destination{font-size:34px;font-weight:700;margin:16px 0}#bkd-taller .primary{background:#007eaf;color:#fff;border-color:#007eaf;font-weight:650}#bkd-taller .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}#bkd-taller .stop{color:light-dark(#b32b32,#ffb1b4)}#bkd-taller .notice{padding:14px 18px;background:light-dark(#fff0cc,#47391e);border-radius:10px;margin-bottom:18px}#bkd-taller .time{display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid light-dark(#d9e1e7,#3b4852);padding-top:16px;margin-top:22px}#bkd-taller .time strong{display:block;font-variant-numeric:tabular-nums}#bkd-taller input,#bkd-taller select,#bkd-taller textarea{font:inherit;padding:12px;border:1px solid light-dark(#b2c1cc,#667682);border-radius:8px;background:light-dark(#fff,#18232d);color:inherit;max-width:100%}#bkd-taller label{display:block;margin:14px 0 6px}#bkd-taller .log{padding:16px 24px;background:light-dark(#fff,#202c36);border-top:1px solid light-dark(#d9e1e7,#3b4852)}#bkd-taller .report{white-space:pre-wrap}#bkd-taller .error{color:light-dark(#a61e28,#ffb1b4)}@media(max-width:650px){#bkd-taller .layout{grid-template-columns:1fr}#bkd-taller aside{border-right:0;border-bottom:1px solid #8997a555}#bkd-taller .machines{display:grid;grid-template-columns:1fr 1fr;gap:10px}#bkd-taller .machine{margin:0;padding:12px}#bkd-taller main{padding:18px}#bkd-taller .destination{font-size:28px}#bkd-taller header{padding-left:18px}}

<div class="layout"><aside><h3>Mis procesos</h3><div class="machines" id="bkd-machines"></div><small>Una intervención a la vez.<br>Los ciclos automáticos continúan.</small><div class="actions"><button id="bkd-cycle">Simular fin de ciclo de prensa</button></div></aside><main id="bkd-content"></main></div>
<div class="log" aria-live="polite" id="bkd-log">Turno de demostración · Roscado de 350 piezas asignado.</div>
<script>
(()=>{const root=document.getElementById('bkd-taller');const $=s=>root.querySelector(s);const tasks=[{name:'Prensa P-02',of:'OF-2048 · Corte de chapa',step:2,auto:true,attention:false,blocked:false,done:false,op:240,mach:720},{name:'Roscadora R-01',of:'OF-2051 · Roscado M6',step:0,auto:false,attention:false,blocked:false,done:false,op:0,mach:0}];let selected=1,mode='',report=[],message='',scanError='',paused=false;const stages=[['Recoge la caja de 350 piezas','Ubicación 58','58','Verifica el QR de la balda o de la caja asignada.'],['Lleva la caja a la roscadora','Roscadora R-01','R-01','Verifica el QR de la máquina antes de trabajar.'],['Rosca las 350 piezas','Roscado M6',null,'Registra la cantidad al finalizar la operación.'],['Devuelve la caja a su ubicación','Ubicación 58','58','Verifica el QR de destino antes de confirmar el depósito.']];function log(s){$('#bkd-log').textContent=s}function fmt(n){return Math.floor(n/60).toString().padStart(2,'0')+':'+(n%60).toString().padStart(2,'0')}function render(){const t=tasks[selected];$('#bkd-machines').innerHTML=tasks.map((x,i)=>`<button class="machine" data-task="${i}" aria-pressed="${i===selected}"><strong>${x.name}</strong><small>${x.of}</small><span class="status">${x.blocked?'⛔ Bloqueado':x.done?'✓ Finalizado':x.attention?'● Requiere atención':x.auto?'● En automático':i===selected&&!paused?'● En atención':'○ Pendiente / en espera'}</span></button>`).join('');let html=`<small>${t.of}</small>`;if(tasks.some(x=>x.attention))html+='<div class="notice">Prensa P-02 · Ciclo terminado. Necesita descarga.</div>';if(mode==='report'){html+='<h2>Reporte de paradas</h2><div class="step report" id="bkd-report-text"></div><button data-action="back">Volver a la tarea</button>';$('#bkd-content').innerHTML=html;$('#bkd-report-text').textContent=report.length?report.map(x=>x).join('\n\n'):'Sin paradas registradas.';return}if(mode==='stop'){html+=`<h2>Bloquear este proceso</h2><div class="step"><label for="bkd-reason">Motivo de la parada</label><select id="bkd-reason"><option>Rotura de troquel</option><option>Corte de suministro eléctrico</option><option>Comportamiento del material</option><option>Falta de material</option><option>Calidad</option><option>Otro</option></select><label for="bkd-note">Observaciones</label><textarea id="bkd-note" rows="2"></textarea><div class="actions"><button class="primary" data-action="block">Registrar y bloquear</button><button data-action="back">Cancelar</button></div></div>`}else if(t.blocked){html+='<h2>Proceso bloqueado</h2><div class="step">Parada registrada. Puedes atender el otro proceso.</div><button data-action="report">Ver reporte</button>'}else if(t.done){html+='<h2>Trabajo completado</h2><div class="step">Producción y movimientos registrados en esta demo.</div><button data-action="report">Ver reporte de paradas</button>'}else if(selected===0){html+=`<h2>${t.auto?'La prensa sigue trabajando':'Retira las piezas de la prensa'}</h2><div class="step"><div class="destination">Prensa P-02</div><p>${t.auto?'Puedes atender la roscadora mientras continúa el ciclo automático.':'Verifica el QR de la máquina para continuar con la descarga.'}</p>${!t.auto?scan('P-02'):''}</div>`}else{const s=stages[t.step];html+=`<small> · Paso ${t.step+1} de 4</small><h2>${s[0]}</h2><div class="step"><div class="destination">${s[1]}</div><p>${s[3]}</p>${s[2]?scan(s[2]):'<label for="bkd-qty">Piezas terminadas (lote de 350)</label><input id="bkd-qty" type="number" value="350" min="0" max="350"><div class="actions"><button class="primary" data-action="quantity">Registrar producción</button></div>'}<div class="error" role="alert">${scanError}</div></div>`}if(mode!=='stop'&&!t.blocked&&!t.done)html+=`<div class="actions"><button data-action="pause">${paused?'Retomar mi intervención':'Pausar mi intervención'}</button><button class="stop" data-action="stop">Parada / incidencia</button><button data-action="report">Reporte</button></div>`;html+=`<div class="time"><div><small>Tiempo de operario</small><strong id="bkd-op">${fmt(t.op)}</strong></div><div><small>Tiempo de máquina</small><strong id="bkd-mach">${fmt(t.mach)}</strong></div><div><small>Ubicación 58 · caja OF-2051</small><strong>${tasks[1].step===0?'350 piezas · pendiente de recogida':tasks[1].done?'350 piezas roscadas · depositadas':'Caja fuera · ubicación reservada'}</strong></div></div>`;$('#bkd-content').innerHTML=html}function scan(code){return `<label for="bkd-code">Código QR esperado: ${code}</label><input id="bkd-code" placeholder="Introduce el código de prueba" autocomplete="off"><div class="actions"><button class="primary" data-action="scan">Verificar código</button><button data-action="simulate">Simular QR correcto</button></div><small>Simulación: no utiliza la cámara.</small>`}root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.task!==undefined){selected=Number(b.dataset.task);mode='';scanError='';paused=false;render();return}if(b.id==='bkd-cycle'){const t=tasks[0];if(t.auto&&!t.blocked){t.auto=false;t.attention=true;log('Aviso: la prensa ha terminado. La roscadora conserva su paso.');render()}return}const a=b.dataset.action,t=tasks[selected];if(a==='back'){mode='';render()}if(a==='report'){mode='report';render()}if(a==='stop'){mode='stop';render()}if(a==='pause'){paused=!paused;log(paused?'Intervención pausada. Los procesos automáticos continúan.':'Intervención retomada.');render()}if(a==='block'){const reason=$('#bkd-reason').value,note=$('#bkd-note').value;report.push(new Date().toLocaleTimeString('es-ES')+' · '+t.name+' · '+t.of+'\nMotivo: '+reason+(note?'\nObservaciones: '+note:''));t.blocked=true;t.auto=false;t.attention=false;mode='';log('Proceso bloqueado y reporte de parada registrado en la demo.');render()}if(a==='scan'||a==='simulate'){const expected=selected===0?'P-02':stages[t.step][2];if(a==='scan'&&$('#bkd-code').value.trim()!==expected){scanError='Código incorrecto. Debes verificar '+expected+'.';render();return}if(paused){scanError='Retoma tu intervención antes de continuar.';render();return}if(selected===0){t.done=true;t.attention=false;log('Prensa verificada · descarga confirmada en la demo.')}else{t.step++;if(t.step===4)t.done=true;log(t.done?'Ubicación 58 verificada · 350 piezas roscadas depositadas.':'QR '+expected+' verificado · siguiente paso disponible.')}scanError='';render()}if(a==='quantity'){const n=Number($('#bkd-qty').value);if(n!==350){scanError='Esta ruta de demostración requiere las 350 piezas. Para producción parcial, registra una incidencia.';render();return}if(paused){scanError='Retoma tu intervención antes de registrar producción.';render();return}t.step=3;scanError='';log('350 piezas roscadas registradas · falta devolver la caja.');render()}});setInterval(()=>{tasks.forEach((t,i)=>{if(t.blocked||t.done)return;if(t.auto)t.mach++;if(i===selected&&!paused&&!mode&&!t.auto)t.op++;if(i===1&&i===selected&&t.step===2&&!paused&&!mode)t.mach++});const t=tasks[selected];if($('#bkd-op'))$('#bkd-op').textContent=fmt(t.op);if($('#bkd-mach'))$('#bkd-mach').textContent=fmt(t.mach)},1000);render()})();
</script>
</div>

<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };

    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,

    focusout: handleLeave,

    contextmenu: handleContextMenu,
  };

      observer.disconnect();

<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>

<script>
(()=>{
 const button=document.getElementById('bkd-fullscreen');
 const message=document.getElementById('bkd-fullscreen-message');
 const active=()=>Boolean(document.fullscreenElement||document.webkitFullscreenElement);
 function sync(){button.textContent=active()?'Salir de pantalla completa':'Pantalla completa';button.setAttribute('aria-pressed',String(active()));}
 button.addEventListener('click',async()=>{
  message.textContent='';
  try{
   if(active()){
    const exit=document.exitFullscreen||document.webkitExitFullscreen;
    if(exit)await exit.call(document);
   }else{
    const enter=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
    if(!enter){message.textContent='Este navegador no admite pantalla completa. En iPad o iPhone, utiliza Compartir → Añadir a pantalla de inicio.';return;}
    await enter.call(document.documentElement);
   }
   sync();
  }catch(error){message.textContent='No se ha podido activar pantalla completa. Prueba desde la página abierta directamente en el navegador.';}
 });
 document.addEventListener('fullscreenchange',sync);
 document.addEventListener('webkitfullscreenchange',sync);
 sync();
})();
</script>
